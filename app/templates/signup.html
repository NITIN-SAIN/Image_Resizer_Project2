<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Image Resizer</title>
</head>

<body>

    <h1>Create Account</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.signup') }}">

        <label>Username</label>
        <input
            type="text"
            name="username"
            required
        >

        <br><br>

        <label>Email</label>
        <input
            type="email"
            name="email"
            required
        >

        <br><br>

        <label>Password</label>
        <input
            type="password"
            name="password"
            required
        >

        <br><br>

        <button type="submit">Create Account</button>

    </form>

</body>
</html>
